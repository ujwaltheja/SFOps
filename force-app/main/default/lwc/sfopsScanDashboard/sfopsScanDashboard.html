<template>
    <lightning-card title="Code Quality Scanner" icon-name="standard:search">
        <lightning-button label="New Scan" slot="actions" variant="brand" onclick={handleOpenScan}></lightning-button>
        <template if:true={isLoading}><lightning-spinner alternative-text="Loading"></lightning-spinner></template>
        <template if:false={isLoading}>
            <lightning-datatable key-field="Id" data={scans} columns={columns} hide-checkbox-column></lightning-datatable>
        </template>
    </lightning-card>
    <template if:true={showScanModal}>
        <section class="slds-modal slds-fade-in-open"><div class="slds-modal__container">
            <header class="slds-modal__header"><h2 class="slds-modal__title">New Scan</h2></header>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-combobox label="Scan Type" value={scanType} options={scanTypeOptions} onchange={handleTypeChange}></lightning-combobox>
                <lightning-combobox label="Target" value={scanTarget} options={targetOptions} onchange={handleTargetChange}></lightning-combobox>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCloseScan}></lightning-button>
                <lightning-button label="Start Scan" variant="brand" onclick={handleStartScan}></lightning-button>
            </footer>
        </div></section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
