<template>
    <lightning-card title="SFOps Settings" icon-name="standard:settings">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">AI Features</h3>
                    <lightning-input type="toggle" label="Enable AI Agents" data-field="enableAI" checked={settings.enableAI} onchange={handleToggle}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Backup</h3>
                    <lightning-input type="toggle" label="Auto Backup" data-field="autoBackup" checked={settings.autoBackup} onchange={handleToggle}></lightning-input>
                    <lightning-input type="number" label="Retention Days" data-field="retentionDays" value={settings.retentionDays} onchange={handleChange}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Monitoring</h3>
                    <lightning-input type="toggle" label="Drift Detection" data-field="driftDetection" checked={settings.driftDetection} onchange={handleToggle}></lightning-input>
                    <lightning-input type="toggle" label="Auto Rollback" data-field="autoRollback" checked={settings.autoRollback} onchange={handleToggle}></lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-2 slds-m-top_medium">
                    <h3 class="slds-text-heading_small slds-m-bottom_small">Scanning</h3>
                    <lightning-combobox label="Scan Schedule" data-field="scanSchedule" value={settings.scanSchedule} options={scheduleOptions} onchange={handleChange}></lightning-combobox>
                </div>
            </div>
            <div class="slds-m-top_large">
                <lightning-button label="Save Settings" variant="brand" onclick={handleSave}></lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
