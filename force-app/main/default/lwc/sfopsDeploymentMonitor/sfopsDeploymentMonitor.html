<template>
    <lightning-card title="Deployment Monitor" icon-name="standard:activations">
        <template if:true={error}><div class="slds-p-around_medium"><p class="slds-text-color_error">{error}</p></div></template>
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <dl class="slds-dl_horizontal">
                        <dt class="slds-dl_horizontal__label">Status:</dt>
                        <dd class="slds-dl_horizontal__detail"><lightning-badge label={deployment.Status__c}></lightning-badge></dd>
                        <dt class="slds-dl_horizontal__label">Components:</dt>
                        <dd class="slds-dl_horizontal__detail">{deployment.Total_Components__c}</dd>
                        <dt class="slds-dl_horizontal__label">Initiated By:</dt>
                        <dd class="slds-dl_horizontal__detail">{deployment.Initiated_By__c}</dd>
                    </dl>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <dl class="slds-dl_horizontal">
                        <dt class="slds-dl_horizontal__label">Start:</dt>
                        <dd class="slds-dl_horizontal__detail"><lightning-formatted-date-time value={deployment.Start_Time__c}></lightning-formatted-date-time></dd>
                        <dt class="slds-dl_horizontal__label">Success:</dt>
                        <dd class="slds-dl_horizontal__detail slds-text-color_success">{deployment.Success_Count__c}</dd>
                        <dt class="slds-dl_horizontal__label">Errors:</dt>
                        <dd class="slds-dl_horizontal__detail slds-text-color_error">{deployment.Error_Count__c}</dd>
                    </dl>
                </div>
            </div>
            <template if:true={isInProgress}>
                <div class="slds-m-top_medium">
                    <lightning-progress-bar value="50" size="large"></lightning-progress-bar>
                    <lightning-button label="Cancel" variant="destructive" onclick={handleCancel} class="slds-m-top_small"></lightning-button>
                </div>
            </template>
        </div>
        <template if:true={hasEvents}>
            <div class="slds-p-around_medium">
                <h3 class="slds-text-heading_small slds-m-bottom_small">Progress Log</h3>
                <ul class="slds-timeline">
                    <template for:each={progressEvents} for:item="evt">
                        <li key={evt.Timestamp__c} class="slds-timeline__item">
                            <span class="slds-badge slds-badge_inverse slds-m-right_x-small">{evt.Status__c}</span> {evt.Message__c}
                        </li>
                    </template>
                </ul>
            </div>
        </template>
    </lightning-card>
</template>
