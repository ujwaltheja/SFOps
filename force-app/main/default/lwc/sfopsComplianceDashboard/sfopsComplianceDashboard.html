<template>
    <lightning-card title="Compliance Dashboard" icon-name="standard:calibration">
        <lightning-button label="Generate Report" slot="actions" variant="brand" onclick={handleOpenGenerate}></lightning-button>
        <template if:true={isLoading}><lightning-spinner alternative-text="Loading"></lightning-spinner></template>
        <template if:false={isLoading}>
            <lightning-datatable key-field="Id" data={reports} columns={reportColumns} hide-checkbox-column></lightning-datatable>
        </template>
    </lightning-card>
    <lightning-card title="Operational Alerts" icon-name="standard:announcement" class="slds-m-top_medium">
        <template if:true={hasAlerts}>
            <lightning-datatable key-field="Id" data={alerts} columns={alertColumns} hide-checkbox-column></lightning-datatable>
        </template>
        <template if:false={hasAlerts}>
            <div class="slds-p-around_medium slds-text-align_center"><p>No active alerts</p></div>
        </template>
    </lightning-card>
    <template if:true={showGenerateModal}>
        <section class="slds-modal slds-fade-in-open"><div class="slds-modal__container">
            <header class="slds-modal__header"><h2 class="slds-modal__title">Generate Compliance Report</h2></header>
            <div class="slds-modal__content slds-p-around_medium">
                <lightning-combobox label="Report Type" value={reportType} options={reportTypeOptions} onchange={handleTypeChange}></lightning-combobox>
                <lightning-input label="Period Start" type="date" onchange={handleStartChange}></lightning-input>
                <lightning-input label="Period End" type="date" onchange={handleEndChange}></lightning-input>
            </div>
            <footer class="slds-modal__footer">
                <lightning-button label="Cancel" onclick={handleCloseGenerate}></lightning-button>
                <lightning-button label="Generate" variant="brand" onclick={handleGenerate}></lightning-button>
            </footer>
        </div></section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
