<template>
    <lightning-card title="Notifications" icon-name="standard:feed">
        <lightning-badge label={badgeLabel} slot="actions" class="slds-badge_inverse"></lightning-badge>
        <template if:true={hasNotifications}>
            <ul class="slds-has-dividers_bottom-space">
                <template for:each={notifications} for:item="notif">
                    <li key={notif.Id} class="slds-item slds-p-around_small">
                        <div class="slds-grid slds-grid_align-spread">
                            <div>
                                <lightning-badge label={notif.Type__c} class="slds-m-right_x-small"></lightning-badge>
                                <span>{notif.Message__c}</span>
                            </div>
                            <lightning-button-icon icon-name="utility:check" data-id={notif.Id} onclick={handleMarkRead} alternative-text="Mark read" variant="bare"></lightning-button-icon>
                        </div>
                    </li>
                </template>
            </ul>
        </template>
        <template if:false={hasNotifications}>
            <div class="slds-p-around_medium slds-text-align_center"><p>No notifications</p></div>
        </template>
    </lightning-card>
</template>
