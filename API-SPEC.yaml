openapi: 3.0.3
info:
  title: SFOps API
  description: |
    **SFOps** - Salesforce Deployment Automation Platform API

    Complete REST API for managing Salesforce deployments, validations, rollbacks, and approvals.

    ## Authentication
    All endpoints (except `/auth/*`) require JWT authentication via Bearer token.

    ## Rate Limiting
    - 1000 requests per hour per user
    - 100 requests per minute per user

    ## Versioning
    API version is included in the URL path: `/api/v1/*`
  version: 1.0.0
  contact:
    name: SFOps Support
    email: support@sfops.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
  - url: https://api.sfops.io/api/v1
    description: Production server

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Users
    description: User management operations
  - name: Organizations
    description: Salesforce org management
  - name: Deployments
    description: Deployment operations
  - name: Approvals
    description: Approval workflow management
  - name: Artifacts
    description: Deployment artifact management
  - name: Logs
    description: Deployment logs and audit trails
  - name: Notifications
    description: Notification preferences and history

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request parameters
        details:
          type: object
        timestamp:
          type: string
          format: date-time

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          enum: [super_admin, org_admin, deployer, approver, viewer]
        isActive:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        alias:
          type: string
        orgType:
          type: string
          enum: [production, sandbox, scratch, developer]
        instanceUrl:
          type: string
          format: uri
        orgId:
          type: string
        apiVersion:
          type: string
          default: "59.0"
        environment:
          type: string
          enum: [dev, qa, uat, staging, production]
        testLevel:
          type: string
          enum: [NoTestRun, RunSpecifiedTests, RunLocalTests, RunAllTestsInOrg]
        minCoverageRequired:
          type: integer
          minimum: 0
          maximum: 100
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    Deployment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deploymentNumber:
          type: integer
        name:
          type: string
        description:
          type: string
        orgId:
          type: string
          format: uuid
        repositoryUrl:
          type: string
          format: uri
        branch:
          type: string
        commitSha:
          type: string
        commitMessage:
          type: string
        deploymentType:
          type: string
          enum: [validate, deploy, quick_deploy, rollback]
        validateOnly:
          type: boolean
        testLevel:
          type: string
          enum: [NoTestRun, RunSpecifiedTests, RunLocalTests, RunAllTestsInOrg]
        specifiedTests:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, queued, validating, deploying, testing, success, failed, canceled, rolled_back, awaiting_approval]
        sfDeploymentId:
          type: string
        componentsTotal:
          type: integer
        componentsDeployed:
          type: integer
        componentsFailed:
          type: integer
        testsTotal:
          type: integer
        testsPassed:
          type: integer
        testsFailed:
          type: integer
        codeCoveragePercentage:
          type: number
          format: float
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        durationSeconds:
          type: integer
        errorMessage:
          type: string
        requiresApproval:
          type: boolean
        approvalStatus:
          type: string
          enum: [pending, approved, rejected, expired]
        createdBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    Approval:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        requestedBy:
          type: string
          format: uuid
        requestedAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [pending, approved, rejected, expired, canceled]
        approverId:
          type: string
          format: uuid
        approvedAt:
          type: string
          format: date-time
        comments:
          type: string
        rejectionReason:
          type: string
        expiresAt:
          type: string
          format: date-time

    Artifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        orgId:
          type: string
          format: uuid
        name:
          type: string
        version:
          type: string
        artifactType:
          type: string
          enum: [package, snapshot, rollback]
        storagePath:
          type: string
        fileSizeBytes:
          type: integer
        checksum:
          type: string
        fileCount:
          type: integer
        metadataTypes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    DeployLog:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deploymentId:
          type: string
          format: uuid
        timestamp:
          type: string
          format: date-time
        level:
          type: string
          enum: [debug, info, warn, error]
        message:
          type: string
        component:
          type: string
        logType:
          type: string

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        totalItems:
          type: integer

security:
  - BearerAuth: []

paths:
  # Authentication Endpoints
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstName
                - lastName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  minLength: 8
                firstName:
                  type: string
                lastName:
                  type: string
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      responses:
        '200':
          description: Logout successful

  # User Endpoints
  /users:
    get:
      tags:
        - Users
      summary: List all users
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: role
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /users/{userId}:
    get:
      tags:
        - Users
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found

    patch:
      tags:
        - Users
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                role:
                  type: string
                isActive:
                  type: boolean
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

    delete:
      tags:
        - Users
      summary: Delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted successfully

  # Organization Endpoints
  /orgs:
    get:
      tags:
        - Organizations
      summary: List all organizations
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: environment
          in: query
          schema:
            type: string
            enum: [dev, qa, uat, staging, production]
      responses:
        '200':
          description: Organizations retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Organization'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Organizations
      summary: Create new organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - alias
                - orgType
                - instanceUrl
                - orgId
                - environment
              properties:
                name:
                  type: string
                alias:
                  type: string
                orgType:
                  type: string
                  enum: [production, sandbox, scratch, developer]
                instanceUrl:
                  type: string
                  format: uri
                orgId:
                  type: string
                environment:
                  type: string
                  enum: [dev, qa, uat, staging, production]
                testLevel:
                  type: string
                  default: RunLocalTests
                minCoverageRequired:
                  type: integer
                  default: 75
      responses:
        '201':
          description: Organization created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  /orgs/{orgId}:
    get:
      tags:
        - Organizations
      summary: Get organization by ID
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Organization retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

    patch:
      tags:
        - Organizations
      summary: Update organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                testLevel:
                  type: string
                minCoverageRequired:
                  type: integer
                isActive:
                  type: boolean
      responses:
        '200':
          description: Organization updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

    delete:
      tags:
        - Organizations
      summary: Delete organization
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Organization deleted successfully

  /orgs/{orgId}/auth:
    post:
      tags:
        - Organizations
      summary: Authenticate with Salesforce org
      parameters:
        - name: orgId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - authType
              properties:
                authType:
                  type: string
                  enum: [oauth, jwt, username_password]
                username:
                  type: string
                password:
                  type: string
                securityToken:
                  type: string
                clientId:
                  type: string
                clientSecret:
                  type: string
                privateKey:
                  type: string
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentialId:
                    type: string
                    format: uuid
                  authenticated:
                    type: boolean

  # Deployment Endpoints
  /deployments:
    get:
      tags:
        - Deployments
      summary: List all deployments
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Deployments retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Deployment'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags:
        - Deployments
      summary: Create new deployment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orgId
                - branch
                - commitSha
              properties:
                orgId:
                  type: string
                  format: uuid
                name:
                  type: string
                description:
                  type: string
                repositoryUrl:
                  type: string
                  format: uri
                branch:
                  type: string
                commitSha:
                  type: string
                deploymentType:
                  type: string
                  enum: [validate, deploy]
                  default: validate
                validateOnly:
                  type: boolean
                  default: false
                testLevel:
                  type: string
                  default: RunLocalTests
                specifiedTests:
                  type: array
                  items:
                    type: string
                checkOnly:
                  type: boolean
                  default: false
                rollbackOnError:
                  type: boolean
                  default: true
      responses:
        '201':
          description: Deployment created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'

  /deployments/{deploymentId}:
    get:
      tags:
        - Deployments
      summary: Get deployment by ID
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'

    delete:
      tags:
        - Deployments
      summary: Cancel deployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment canceled successfully

  /deployments/{deploymentId}/logs:
    get:
      tags:
        - Deployments
      summary: Get deployment logs
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          schema:
            type: string
            enum: [debug, info, warn, error]
      responses:
        '200':
          description: Logs retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeployLog'

  /deployments/{deploymentId}/retry:
    post:
      tags:
        - Deployments
      summary: Retry failed deployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deployment retry initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'

  /deployments/{deploymentId}/rollback:
    post:
      tags:
        - Deployments
      summary: Rollback deployment
      parameters:
        - name: deploymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Rollback deployment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deployment'

  # Approval Endpoints
  /approvals:
    get:
      tags:
        - Approvals
      summary: List all approvals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        '200':
          description: Approvals retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Approval'

  /approvals/{approvalId}/approve:
    post:
      tags:
        - Approvals
      summary: Approve deployment
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comments:
                  type: string
      responses:
        '200':
          description: Deployment approved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'

  /approvals/{approvalId}/reject:
    post:
      tags:
        - Approvals
      summary: Reject deployment
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - rejectionReason
              properties:
                rejectionReason:
                  type: string
                comments:
                  type: string
      responses:
        '200':
          description: Deployment rejected successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Approval'

  # Artifact Endpoints
  /artifacts:
    get:
      tags:
        - Artifacts
      summary: List all artifacts
      parameters:
        - name: orgId
          in: query
          schema:
            type: string
            format: uuid
        - name: artifactType
          in: query
          schema:
            type: string
            enum: [package, snapshot, rollback]
      responses:
        '200':
          description: Artifacts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Artifact'

  /artifacts/{artifactId}:
    get:
      tags:
        - Artifacts
      summary: Get artifact by ID
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Artifact retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Artifact'

  /artifacts/{artifactId}/download:
    get:
      tags:
        - Artifacts
      summary: Download artifact
      parameters:
        - name: artifactId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Artifact download URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl:
                    type: string
                    format: uri
                  expiresAt:
                    type: string
                    format: date-time

  # System Endpoints
  /health:
    get:
      tags:
        - System
      summary: Health check
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  version:
                    type: string
                  timestamp:
                    type: string
                    format: date-time

  /metrics:
    get:
      tags:
        - System
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Metrics in Prometheus format
          content:
            text/plain:
              schema:
                type: string
