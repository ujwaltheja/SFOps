version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sfops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sfops
      POSTGRES_USER: sfops_user
      POSTGRES_PASSWORD: sfops_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sfops_user -d sfops"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sfops-network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: sfops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass sfops_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sfops-network

  # MinIO Object Storage (S3-compatible)
  minio:
    image: minio/minio:latest
    container_name: sfops-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sfops-network

  # HashiCorp Vault (Secrets Management)
  vault:
    image: hashicorp/vault:latest
    container_name: sfops-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: sfops_vault_token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sfops-network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sfops-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: sfops
      DATABASE_USER: sfops_user
      DATABASE_PASSWORD: sfops_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: sfops_redis_password
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: sfops_vault_token
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: sfops-artifacts
      JWT_SECRET: dev_jwt_secret_min_32_characters_required
      JWT_REFRESH_SECRET: dev_refresh_secret_min_32_chars
    ports:
      - "4000:4000"
      - "9229:9229"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - backend_logs:/var/log/sfops
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - sfops-network
    command: npm run dev

  # Worker Service
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: sfops-worker
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: sfops
      DATABASE_USER: sfops_user
      DATABASE_PASSWORD: sfops_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: sfops_redis_password
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: sfops_vault_token
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      QUEUE_CONCURRENCY: 3
    volumes:
      - ./backend:/app
      - /app/node_modules
      - worker_logs:/var/log/sfops
      - worker_workspace:/tmp/sfops-workspaces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sfops-network
    command: npm run dev:workers

  # Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: sfops-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:4000
      VITE_WS_URL: ws://localhost:4000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - sfops-network
    command: npm run dev

  # Prometheus (Metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: sfops-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - sfops-network

  # Grafana (Visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: sfops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      - prometheus
    networks:
      - sfops-network

networks:
  sfops-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  vault_data:
  vault_logs:
  backend_logs:
  worker_logs:
  worker_workspace:
  prometheus_data:
  grafana_data:
